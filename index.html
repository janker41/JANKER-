<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JANKER</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #050505;
      color: white;
      overflow-x: hidden;
    }

    /* خلفية التطبيق */
    .background {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 20%, rgba(220,0,0,0.18), transparent 35%),
        linear-gradient(135deg, #050505, #120000, #050505);
      z-index: -3;
    }

    /* خريطة الجزائر بشكل زخرفي */
    .map {
      position: fixed;
      width: 520px;
      height: 650px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.08;
      z-index: -2;
    }

    .map svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 25px #e00000);
    }

    .map path {
      fill: #e00000;
      stroke: #ff2020;
      stroke-width: 2;
    }

    /* الصفحة */
    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: rgba(10, 10, 10, 0.88);
      border: 1px solid rgba(255, 0, 0, 0.25);
      border-radius: 25px;
      padding: 35px 25px;
      box-shadow:
        0 0 50px rgba(255, 0, 0, 0.12),
        inset 0 0 30px rgba(255, 0, 0, 0.02);
      backdrop-filter: blur(12px);
    }

    /* الشعار */
    .logo {
      text-align: center;
      margin-bottom: 8px;
    }

    .logo h1 {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: 7px;
      color: white;
      text-shadow: 0 0 20px rgba(255,0,0,0.35);
    }

    .red-line {
      width: 75px;
      height: 4px;
      background: #e00000;
      margin: 12px auto 35px;
      border-radius: 10px;
      box-shadow: 0 0 12px #e00000;
    }

    .welcome {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
      font-size: 14px;
    }

    /* الحقول */
    .input-group {
      margin-bottom: 17px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: #ddd;
      font-size: 14px;
    }

    .input-box {
      position: relative;
    }

    .input-box span {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #e00000;
      font-size: 18px;
    }

    input {
      width: 100%;
      height: 55px;
      background: #111;
      color: white;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 0 48px 0 15px;
      outline: none;
      font-size: 15px;
      transition: 0.3s;
    }

    input:focus {
      border-color: #e00000;
      box-shadow: 0 0 15px rgba(224,0,0,0.15);
    }

    /* نسيت كلمة السر */
    .forgot {
      text-align: left;
      margin: -5px 0 20px;
    }

    .forgot a {
      color: #ff3030;
      text-decoration: none;
      font-size: 14px;
    }

    /* الأزرار */
    .login-btn {
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 15px;
      background: linear-gradient(135deg, #e00000, #a00000);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(224,0,0,0.20);
      transition: 0.25s;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(224,0,0,0.35);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 25px 0;
      color: #666;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #292929;
    }

    .register-btn {
      width: 100%;
      height: 55px;
      border-radius: 15px;
      border: 1px solid #e00000;
      background: transparent;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.25s;
    }

    .register-btn:hover {
      background: rgba(224,0,0,0.10);
    }

    .footer {
      text-align: center;
      color: #555;
      font-size: 11px;
      margin-top: 28px;
      letter-spacing: 1px;
      direction: ltr;
    }

    /* الهاتف */
    @media (max-width: 480px) {
      .page {
        padding: 15px;
      }

      .login-box {
        padding: 30px 20px;
        border-radius: 22px;
      }

      .logo h1 {
        font-size: 40px;
        letter-spacing: 5px;
      }

      .map {
        width: 400px;
        height: 520px;
      }
    }
  </style>
</head>

<body>
